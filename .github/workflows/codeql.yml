name: CodeQL
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: '27 3 * * 1'
permissions:
  actions: read
  contents: read
  security-events: write
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  analyze:
    name: Analyze (javascript-typescript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # CodeQL has no Dart extractor; this covers the TypeScript edge
      # functions under supabase/functions. Flutter app code is covered by
      # `flutter analyze` in ci.yml.
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          paths: ['supabase/functions']
      - uses: github/codeql-action/analyze@v3
