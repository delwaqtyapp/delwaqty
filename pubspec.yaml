name: delwaqty
description: "Delwaqty - Production-grade Flutter application."
publish_to: 'none'

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+17
environment:
  sdk: ^3.13.0
dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  go_router: ^14.0.2
  app_links: ^7.2.1
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0
  shared_preferences: ^2.2.3
  share_plus: ^13.3.1
  local_auth: ^3.0.0
  flutter_secure_storage: ^11.0.0
  logger: ^2.4.0
  supabase_flutter: ^2.5.0
  connectivity_plus: ^6.0.3
  google_maps_flutter: ^2.18.0
  http: ^1.6.0
  firebase_core: ^4.12.1
  firebase_messaging: ^16.4.3
  firebase_crashlytics: ^5.2.6
  lottie: ^3.3.1
  url_launcher: ^6.3.1
  geolocator: ^14.0.3
  permission_handler: ^11.3.1
  record: ^7.1.1
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  timezone: ^0.11.1
  image_picker: ^1.2.3
  mobile_scanner: ^7.5.0
  flutter_local_notifications: ^22.2.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  file_picker: ^12.0.0
  audioplayers: ^6.8.1
  path_provider: ^2.1.6
  package_info_plus: ^10.2.1
  crypto: ^3.0.7
  pdfrx: 2.4.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.4
  build_runner: '>=2.15.3 <2.16.0'
  freezed: ^4.0.1
  json_serializable: ^6.14.1
  riverpod_lint: ^3.1.9
  flutter_gen_runner: ^5.15.0
  plugin_platform_interface: any
dependency_overrides:
  path_provider_foundation: 2.4.2
flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/lottie/
    - assets/lottie/roles/
    - assets/logo app/logo.webp
    - assets/branding/
    - assets/egypt/
    - assets/profile/
    - assets/categories/
  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-300.ttf
          weight: 300
        - asset: assets/fonts/Cairo-400.ttf
          weight: 400
        - asset: assets/fonts/Cairo-500.ttf
          weight: 500
        - asset: assets/fonts/Cairo-600.ttf
          weight: 600
        - asset: assets/fonts/Cairo-700.ttf
          weight: 700
        - asset: assets/fonts/Cairo-800.ttf
          weight: 800
        - asset: assets/fonts/Cairo-900.ttf
          weight: 900
flutter_gen:
  line_length: 80
  integrations:
    lottie: true
