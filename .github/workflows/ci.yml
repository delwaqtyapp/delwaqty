name: CI/CD Pipeline

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master]

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test --coverage

  build:
    needs: analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
      - run: flutter pub get
      - run: flutter build apk --debug
      - run: flutter build apk --release
      - run: flutter build appbundle --release
      - name: Copy APK to releases
        run: |
          mkdir -p releases
          cp build/app/outputs/flutter-apk/app-debug.apk releases/delwaqty_debug_${{ github.run_number }}.apk
          cp build/app/outputs/flutter-apk/app-release.apk releases/delwaqty_release_${{ github.run_number }}.apk
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: delwaqty-debug-apk
          path: releases/delwaqty_debug_*.apk
          retention-days: 30
      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: delwaqty-release-apk
          path: releases/delwaqty_release_*.apk
          retention-days: 90

  release:
    if: github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download release APK
        uses: actions/download-artifact@v4
        with:
          name: delwaqty-release-apk
          path: releases/
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: releases/*.apk
          generate_release_notes: true
          tag_name: v${{ github.run_number }}
