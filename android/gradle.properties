org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=128m -XX:+HeapDumpOnOutOfMemoryError
org.gradle.workers.max=1
org.gradle.parallel=false
org.gradle.caching=true
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# Disable incremental Kotlin to avoid cross-drive path issues (pub cache on C:, project on E:)
kotlin.incremental=false
kotlin.daemon.jvmargs=-Xmx1G -XX:MaxMetaspaceSize=256m
