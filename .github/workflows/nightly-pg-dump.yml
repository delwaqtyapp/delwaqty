name: Nightly prod schema dump

# Nightly logical backup of the prod database (schema + data) as a private
# workflow artifact. Needs the repo secret SUPABASE_DB_URL (a read-capable
# connection string, pooler/session mode). Without the secret the job
# fails loudly instead of silently skipping.
on:
  schedule:
    - cron: '17 1 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dump:
    name: pg_dump prod
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Require secret
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$DB_URL" ]; then echo "SUPABASE_DB_URL secret is not set" >&2; exit 1; fi
      - name: Install postgresql-client 17
        run: |
          sudo sh -c 'echo "deb https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          wget -qO- https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo tee /etc/apt/trusted.gpg.d/pgdg.asc >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17
      - name: Dump
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          STAMP=$(date -u +%Y%m%dT%H%M%SZ)
          /usr/lib/postgresql/17/bin/pg_dump "$DB_URL" --format=custom --no-owner --no-privileges \
            --schema=public --schema=supabase_migrations --schema=auth --file="prod_${STAMP}.dump"
          /usr/lib/postgresql/17/bin/pg_restore --list "prod_${STAMP}.dump" | wc -l
          sha256sum "prod_${STAMP}.dump" | tee "prod_${STAMP}.dump.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: prod-dump
          path: prod_*.dump*
          retention-days: 14
          if-no-files-found: error
