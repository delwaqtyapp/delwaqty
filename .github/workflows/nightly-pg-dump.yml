name: Nightly prod dump (encrypted)

# Nightly logical backup of the prod database. THIS REPOSITORY IS PUBLIC, and
# workflow artifacts of a public repo are downloadable by any signed-in GitHub
# user, so the dump is NEVER uploaded in plaintext: it is encrypted with `age`
# to a public recipient key, the plaintext is deleted, and only the .age file
# is uploaded (7-day retention). The private key stays offline with the owner.
#
# Disabled until the owner sets up (see docs in this header):
#   1. Repo Environment "backup", deployment branches limited to master.
#      Put the two secrets below in that environment, not in repo secrets.
#   2. Environment secret SUPABASE_DB_URL: connection string of a DEDICATED
#      read-only role (CREATE ROLE backup LOGIN PASSWORD '...'; GRANT
#      pg_read_all_data TO backup;), pooler session mode, ending in
#      ?sslmode=require
#   3. Environment secret AGE_RECIPIENT: the age PUBLIC key (age1...), made
#      with `age-keygen` on the owner's own device; the private key stays offline.
#   4. Repo variable BACKUP_ENABLED = true
#
# Restore: age -d -i key.txt prod_X.dump.age > prod.dump, then pg_restore into
# a scratch database. Do one test restore right after the first run, before
# trusting the backup. NOT covered by this dump: Storage files (buckets), cron
# jobs, realtime publications and extensions; those are re-created from the
# migrations or re-uploaded. Ownership is dropped (--no-owner) but privileges
# are kept (no --no-privileges), so a restore keeps the ACL hardening.
on:
  schedule:
    - cron: '17 1 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dump:
    name: pg_dump prod (encrypted)
    if: vars.BACKUP_ENABLED == 'true'
    environment: backup
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Require secrets
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          AGE_RECIPIENT: ${{ secrets.AGE_RECIPIENT }}
        run: |
          if [ -z "$DB_URL" ]; then echo "SUPABASE_DB_URL secret is not set" >&2; exit 1; fi
          case "$AGE_RECIPIENT" in
            age1*) ;;
            *) echo "AGE_RECIPIENT secret missing or not an age public key; refusing to dump without encryption" >&2; exit 1 ;;
          esac
      - name: Install postgresql-client 17 and age
        run: |
          sudo sh -c 'echo "deb https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          wget -qO- https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo tee /etc/apt/trusted.gpg.d/pgdg.asc >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17 age
      - name: Dump and encrypt
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          AGE_RECIPIENT: ${{ secrets.AGE_RECIPIENT }}
        run: |
          set -euo pipefail
          umask 077
          STAMP=$(date -u +%Y%m%dT%H%M%SZ)
          PLAIN="${RUNNER_TEMP}/prod_${STAMP}.dump"
          /usr/lib/postgresql/17/bin/pg_dump "$DB_URL" --format=custom --no-owner \
            --schema=public --schema=supabase_migrations --schema=auth --file="$PLAIN"
          /usr/lib/postgresql/17/bin/pg_restore --list "$PLAIN" | wc -l
          age -r "$AGE_RECIPIENT" -o "prod_${STAMP}.dump.age" "$PLAIN"
          shred -u "$PLAIN" || rm -f "$PLAIN"
          sha256sum "prod_${STAMP}.dump.age" | tee "prod_${STAMP}.dump.age.sha256"
          # Hard stop: the plaintext must be gone and only ciphertext may sit
          # in the upload directory.
          test ! -e "$PLAIN"
          test "$(ls prod_*.dump 2>/dev/null | wc -l)" = 0
          head -c 22 "prod_${STAMP}.dump.age" | grep -q 'age-encryption.org'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: prod-dump-encrypted
          path: |
            prod_*.dump.age
            prod_*.dump.age.sha256
          retention-days: 7
          if-no-files-found: error
