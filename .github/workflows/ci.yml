name: CI/CD
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  FLUTTER_VERSION: '3.50.1'
  JAVA_VERSION: '17'
jobs:
  # Cheap PRs: APK builds and pgTAP are expensive (~45 of ~55 min per head).
  # On a PR they run only when the diff can affect them (android/, pubspec,
  # build config for APKs; supabase/ for pgTAP). Push to master and tags
  # always run everything. A skipped job counts as passing for the merge gate.
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    outputs:
      android: ${{ steps.d.outputs.android }}
      db: ${{ steps.d.outputs.db }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: d
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "android=true" >> "$GITHUB_OUTPUT"; echo "db=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          files=$(git diff --name-only "origin/$BASE_REF...HEAD")
          echo "$files"
          if echo "$files" | grep -qE '^(android/|build\.yaml$|l10n\.yaml$|analysis_options\.yaml$|pubspec\.(yaml|lock)$|\.github/workflows/|assets/|tool/)'; then a=true; else a=false; fi
          if echo "$files" | grep -qE '^(supabase/|\.github/workflows/)'; then d=true; else d=false; fi
          echo "android=$a" >> "$GITHUB_OUTPUT"; echo "db=$d" >> "$GITHUB_OUTPUT"
  analyze:
    name: Analyze & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs
      - name: Check formatting
        run: dart format --set-exit-if-changed .
      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Design token guard
        run: bash tool/design_guard.sh

      - name: Pharmacy purge guard
        run: |
          bash tool/pharmacy_purge_guard.sh --self-test
          bash tool/pharmacy_purge_guard.sh

      - name: Superseded migrations guard
        run: bash tool/superseded_migrations_guard.sh
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Auth edge safety tests
        run: node --test tool/edge_safety_test.cjs
      - name: Staff admin edge execution tests
        run: node --test tool/edge_staff_admin_test.cjs
      - name: Publisher safety tests
        run: python3 -m unittest discover -s tool -p test_publish_development.py
      - name: Run tests with coverage
        run: flutter test --coverage
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/lcov.info

  gitleaks:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  pgtap-rls:
    name: pgTAP RLS negative tests
    needs: changes
    if: ${{ always() && needs.changes.outputs.db != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: supabase/setup-cli@v1
        with:
          version: 3.2.0
      - name: Start local database
        run: supabase db start
      - name: Install pgTAP and test helpers
        run: >-
          psql "postgresql://postgres:postgres@localhost:54322/postgres"
          -v ON_ERROR_STOP=1
          -c "create extension if not exists pgtap;"
          -f supabase/tests/vendor/supabase_test_helpers_0_0_6.sql
      - name: Run negative RLS tests
        run: >-
          psql "postgresql://postgres:postgres@localhost:54322/postgres"
          -v ON_ERROR_STOP=1
          -f supabase/tests/redteam_pgtap_negative_rls.sql
          -f supabase/tests/redteam_pgtap_hardening_gate.sql
          -f supabase/tests/430_rides_insert_guard_test.sql
          -f supabase/tests/455_cashier_short_keys_only_test.sql
          -f supabase/tests/464_courier_fare_test.sql
          -f supabase/tests/465_delivery_pricing_bounds_test.sql
          -f supabase/tests/469_signup_role_allowlist_test.sql
  build:
    name: Build APK (${{ matrix.flavor }})
    needs: changes
    if: ${{ always() && needs.changes.outputs.android != 'false' }}
    # Only `changes` is needed: builds run in parallel with analyze/test so wall time is
    # max(test, build) instead of test + build. Every job is still a required
    # check, and the publisher requires ALL jobs of the run green.
    strategy:
      fail-fast: false
      matrix:
        flavor: [customer, admin, driver, provider]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: ${{ env.JAVA_VERSION }}
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
      - name: Decode release keystore
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p android/keystore
          echo "$KEYSTORE_BASE64" | base64 -d > android/keystore/release.jks
      - name: Install dependencies
        run: flutter pub get
      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs
      - name: Build debug APK
        run: |
          for attempt in 1 2 3; do
            if flutter build apk --debug --flavor ${{ matrix.flavor }} -t lib/${{ matrix.flavor }}/main.dart; then
              exit 0
            fi
            echo "Debug build attempt $attempt failed; retrying after backoff..."
            sleep $((attempt * 60))
          done
          echo "Debug build failed after 3 attempts"
          exit 1
      - name: Build release APK
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
        run: |
          for attempt in 1 2 3; do
            if flutter build apk --release --target-platform android-arm,android-arm64 --flavor ${{ matrix.flavor }} -t lib/${{ matrix.flavor }}/main.dart; then
              exit 0
            fi
            echo "Release build attempt $attempt failed; retrying after backoff..."
            sleep $((attempt * 60))
          done
          echo "Release build failed after 3 attempts"
          exit 1
      - name: Verify release config in APK
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        run: |
          python3 - "build/app/outputs/flutter-apk/app-${{ matrix.flavor }}-release.apk" <<'PYEOF'
          import sys, zipfile
          z = zipfile.ZipFile(sys.argv[1])
          man = z.read('AndroidManifest.xml')
          so = b''.join(z.read(n) for n in z.namelist() if n.startswith('lib/') and n.endswith('libapp.so'))
          def u16(b, s): return s.encode('utf-16-le') in b or s.encode() in b
          problems = []
          names = z.namelist()
          for need in ('lib/arm64-v8a/libapp.so', 'lib/armeabi-v7a/libapp.so', 'lib/arm64-v8a/libflutter.so', 'lib/armeabi-v7a/libflutter.so'):
              if need not in names:
                  problems.append('missing ' + need)
          if any(n.startswith('lib/x86') for n in names):
              problems.append('x86 libs must not ship in the release APK: ' + ', '.join(n for n in names if n.startswith('lib/x86')))
          if not u16(man, 'com.google.android.geo.API_KEY'):
              problems.append('geo.API_KEY meta-data missing from AndroidManifest')
          if not u16(man, 'AIza'):
              problems.append('Maps API key value empty in AndroidManifest (MAPS_API_KEY not wired?)')
          if not u16(so, 'bttnlkmwhorjamzemwda'):
              problems.append('Supabase URL missing from compiled Dart (libapp.so)')
          if not u16(so, 'eyJhbGci'):
              problems.append('Supabase anon key missing from compiled Dart (libapp.so)')
          if problems:
              print('RELEASE CONFIG GATE FAILED:')
              for p in problems: print(' -', p)
              sys.exit(1)
          print('Release config gate OK:', sys.argv[1])
          PYEOF
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: delwaqty-${{ matrix.flavor }}-debug-${{ github.run_number }}
          path: build/app/outputs/flutter-apk/app-${{ matrix.flavor }}-debug.apk
          retention-days: 14
      - name: Upload release APK
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/upload-artifact@v4
        with:
          name: delwaqty-${{ matrix.flavor }}-release-${{ github.run_number }}
          path: build/app/outputs/flutter-apk/app-${{ matrix.flavor }}-release.apk
          retention-days: 90
