name: CI/CD
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  FLUTTER_VERSION: '3.50.1'
  JAVA_VERSION: '17'
jobs:
  analyze:
    name: Analyze & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs
      - name: Check formatting
        run: dart format --set-exit-if-changed .
      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Design token guard
        run: bash tool/design_guard.sh
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Auth edge safety tests
        run: node --test tool/edge_safety_test.cjs
      - name: Publisher safety tests
        run: python3 -m unittest discover -s tool -p test_publish_development.py
      - name: Run tests with coverage
        run: flutter test --coverage
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/lcov.info

  gitleaks:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  pgtap-rls:
    name: pgTAP RLS negative tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 3.2.0
      - name: Start local database
        run: supabase db start
      - name: Install pgTAP and test helpers
        run: >-
          psql "postgresql://postgres:postgres@localhost:54322/postgres"
          -v ON_ERROR_STOP=1
          -c "create extension if not exists pgtap;"
          -f supabase/tests/vendor/supabase_test_helpers_0_0_6.sql
      - name: Run negative RLS tests
        run: >-
          psql "postgresql://postgres:postgres@localhost:54322/postgres"
          -v ON_ERROR_STOP=1
          -f supabase/tests/redteam_pgtap_negative_rls.sql
          -f supabase/tests/430_rides_insert_guard_test.sql
          retention-days: 7
  build:
    name: Build APK (${{ matrix.flavor }})
    needs: [analyze, test]
    strategy:
      fail-fast: false
      matrix:
        flavor: [customer, admin, driver, provider]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: ${{ env.JAVA_VERSION }}
      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p android/keystore
          echo "$KEYSTORE_BASE64" | base64 -d > android/keystore/release.jks
      - name: Install dependencies
        run: flutter pub get
      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs
      - name: Build debug APK
        run: flutter build apk --debug --flavor ${{ matrix.flavor }} -t lib/${{ matrix.flavor }}/main.dart
      - name: Build release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
        run: flutter build apk --release --flavor ${{ matrix.flavor }} -t lib/${{ matrix.flavor }}/main.dart
      - name: Verify release config in APK
        run: |
          python3 - "build/app/outputs/flutter-apk/app-${{ matrix.flavor }}-release.apk" <<'PYEOF'
          import sys, zipfile
          z = zipfile.ZipFile(sys.argv[1])
          man = z.read('AndroidManifest.xml')
          so = b''.join(z.read(n) for n in z.namelist() if n.startswith('lib/') and n.endswith('libapp.so'))
          def u16(b, s): return s.encode('utf-16-le') in b or s.encode() in b
          problems = []
          if not u16(man, 'com.google.android.geo.API_KEY'):
              problems.append('geo.API_KEY meta-data missing from AndroidManifest')
          if not u16(man, 'AIza'):
              problems.append('Maps API key value empty in AndroidManifest (MAPS_API_KEY not wired?)')
          if not u16(so, 'bttnlkmwhorjamzemwda'):
              problems.append('Supabase URL missing from compiled Dart (libapp.so)')
          if not u16(so, 'eyJhbGci'):
              problems.append('Supabase anon key missing from compiled Dart (libapp.so)')
          if problems:
              print('RELEASE CONFIG GATE FAILED:')
              for p in problems: print(' -', p)
              sys.exit(1)
          print('Release config gate OK:', sys.argv[1])
          PYEOF
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: delwaqty-${{ matrix.flavor }}-debug-${{ github.run_number }}
          path: build/app/outputs/flutter-apk/app-${{ matrix.flavor }}-debug.apk
          retention-days: 14
      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: delwaqty-${{ matrix.flavor }}-release-${{ github.run_number }}
          path: build/app/outputs/flutter-apk/app-${{ matrix.flavor }}-release.apk
          retention-days: 90
