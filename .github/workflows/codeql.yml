name: CodeQL
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: '27 3 * * 1'
  workflow_dispatch:
permissions:
  actions: read
  contents: read
  security-events: write
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  analyze:
    name: Analyze (javascript-typescript)
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v4 (11d5960a326750d5838078e36cf38b85af677262)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      # CodeQL has no Dart extractor; this covers the TypeScript edge
      # functions under supabase/functions. Flutter app code is covered by
      # flutter analyze in ci.yml.
      # github/codeql-action v4.39.5 (v4 tag -> commit 915412ff23e8)
      - uses: github/codeql-action/init@915412ff23e8b7659517e607487dbeae018f2934
        with:
          languages: javascript-typescript
          config: |
            paths:
              - supabase/functions
      # github/codeql-action v4.39.5 (v4 tag -> commit 915412ff23e8)
      - uses: github/codeql-action/analyze@915412ff23e8b7659517e607487dbeae018f2934
